<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat APP 後台</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --text:#1d2433; --muted:#667085; --brand:#6d4aff; --ok:#12b76a; --bad:#f04438; --warn:#f79009; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--text); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:0 24px; display:flex; align-items:center; gap:24px; height:56px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; } header h1 span { color:var(--brand); }
  nav { display:flex; gap:4px; }
  nav button { border:0; background:none; padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--muted); font:inherit; }
  nav button.on { background:#efeaff; color:var(--brand); font-weight:600; }
  .warn { margin-left:auto; font-size:12px; color:var(--warn); }
  main { max-width:1180px; margin:24px auto; padding:0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .k { color:var(--muted); font-size:12px; } .stat .v { font-size:26px; font-weight:700; margin-top:2px; } .stat .s { color:var(--muted); font-size:12px; }
  h2 { font-size:15px; margin:22px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#fafbfc; color:var(--muted); font-weight:600; font-size:12px; }
  tr:last-child td { border-bottom:0; }
  tr.click { cursor:pointer; } tr.click:hover { background:#faf8ff; }
  input, textarea, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; }
  textarea { min-height:90px; resize:vertical; }
  button.btn { background:var(--brand); color:#fff; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  button.btn.ghost { background:#fff; color:var(--text); border:1px solid var(--line); }
  button.btn.danger { background:var(--bad); }
  button.btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .row > input { max-width:320px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:#eef0f4; color:var(--muted); }
  .tag.ok { background:#dcfae6; color:#067647; } .tag.bad { background:#fee4e2; color:#b42318; } .tag.warn { background:#fef0c7; color:#b54708; }
  .muted { color:var(--muted); } .pos { color:var(--ok); font-weight:600; } .neg { color:var(--bad); font-weight:600; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:900px){ .two{grid-template-columns:1fr;} }
  .chat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; max-height:520px; overflow:auto; }
  .msg { margin:8px 0; display:flex; } .msg.user { justify-content:flex-end; }
  .bubble { max-width:75%; padding:8px 12px; border-radius:14px; background:#f2f4f7; white-space:pre-wrap; word-break:break-word; }
  .msg.user .bubble { background:#6d4aff; color:#fff; }
  .msg .meta { font-size:11px; color:var(--muted); margin-top:2px; }
  .modal { position:fixed; inset:0; background:rgba(16,24,40,.45); display:none; align-items:center; justify-content:center; z-index:20; }
  .modal.on { display:flex; } .modal .box { background:#fff; border-radius:14px; padding:20px; width:min(560px,92vw); max-height:90vh; overflow:auto; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  #toast { position:fixed; bottom:20px; right:20px; background:#1d2433; color:#fff; padding:10px 16px; border-radius:10px; display:none; z-index:30; }
  .back { color:var(--brand); cursor:pointer; margin-bottom:10px; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>Chat APP <span>後台</span></h1>
  <nav id="nav">
    <button data-tab="overview" class="on">總覽</button>
    <button data-tab="users">使用者與點數</button>
    <button data-tab="characters">角色</button>
  </nav>
  <div class="warn">⚠ 此後台未設權限,僅供本機開發使用</div>
</header>
<main id="app"></main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n ?? 0).toLocaleString('zh-TW');
const pct = (x) => (x == null ? '—' : (x * 100).toFixed(1) + '%');
const time = (t) => (t ? new Date(t).toLocaleString('zh-TW', { hour12: false }) : '—');

async function api(method, path, body) {
  const res = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json?.error?.message || res.statusText);
  return json;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => (t.style.display = 'none'), 2600); }
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

let timer = null;
let viewVersion = 0;
const tabs = { overview, users, characters };
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(tab) {
  const version = ++viewVersion;
  clearInterval(timer);
  timer = null;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  // 舊頁面尚未完成的 fetch 可能晚一步回來;只有目前這一次導航才可以改 DOM。
  tabs[tab]().catch((e) => {
    if (version === viewVersion) $('#app').innerHTML = `<div class="card">載入失敗:${esc(e.message)}</div>`;
  });
}

// ------------------------------------------------------------------ 總覽
async function overview() {
  const version = viewVersion;
  async function render() {
    const d = await api('GET', '/overview');
    // clearInterval 不能取消已經開始等待 HTTP 回應的 render;靠世代值阻擋它覆蓋新頁籤。
    if (version !== viewVersion) return;
    const a = d.auth, c = d.chat, b = d.billing;
    const card = (k, v, s = '') => `<div class="card stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
    const redisCard = (name, r) => r.error ? `<div class="card">${name}:${esc(r.error)}</div>` : `<div class="card stat"><div class="k">${name}</div><div class="v">${esc(r.used_memory)}</div>
      <div class="s">策略 ${esc(r.maxmemory_policy)} · ${fmt(r.ops_per_sec)} ops/s · ${r.connected_clients} 連線 · 淘汰 ${fmt(r.evicted_keys)}</div></div>`;
    $('#app').innerHTML = `
      <div class="grid">
        ${card('使用者', fmt(a.users), `24h 新增 ${fmt(a.new_users_24h)}`)}
        ${card('目前登入中(單一裝置)', fmt(a.active_sessions), '每位使用者最多 1 個有效 session')}
        ${card('對話 / 訊息', fmt(c.conversations) + ' / ' + fmt(c.messages), `失敗 ${fmt(c.failed_total)}`)}
        ${card('進行中的 AI 回覆', fmt(c.streaming_now), `本 instance ${fmt(c.active_generations_this_instance)} · 待結算 ${fmt(c.billing_pending)}`)}
        ${card('點數:已發放 / 已消耗', fmt(b.total_granted) + ' / ' + fmt(b.total_charged), `使用者持有 ${fmt(b.total_balance)} · 預扣中 ${fmt(b.total_held)}`)}
        ${card('24h 計費筆數', fmt(b.charges_24h), `進行中預扣 ${fmt(b.active_holds)}`)}
      </div>
      <h2>模型供應商(備援鏈)</h2>
      <table><tr><th>順序</th><th>供應商</th><th>模型</th><th>狀態</th><th>連續失敗</th></tr>
      ${(c.llm || []).map((p, i) => `<tr><td>${i === 0 ? '主要' : '備援 ' + i}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.model)}</td>
        <td><span class="tag ${p.state === 'closed' || p.state === 'disabled' ? 'ok' : p.state === 'open' ? 'bad' : 'warn'}">${{ closed: '正常', open: '暫停中(斷路)', 'half-open': '探測中', disabled: '正常 (mock)' }[p.state] || esc(p.state)}</span>
        ${p.state === 'open' ? `<span class="muted">約 ${Math.max(0, Math.ceil((p.retryAt - Date.now()) / 1000))} 秒後重試</span>` : ''}</td><td>${p.consecutiveFailures}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">無資料</td></tr>'}</table>
      <p class="muted" style="margin:4px 0 0">僅反映回應此次請求的那一個 chat instance。</p>
      <h2>Redis</h2>
      <div class="grid">${redisCard('redis-state(session / 鎖 / 串流 / 事件,不淘汰)', d.redis.state)}${redisCard('redis-cache(快取,LRU 淘汰)', d.redis.cache)}</div>
      <h2>應用層快取命中率</h2>
      <table><tr><th>快取</th><th>命中</th><th>未命中</th><th>合併回源</th><th>錯誤(Redis 故障)</th><th>命中率</th></tr>
      ${d.cache.map((x) => `<tr><td>${esc(x.name)}</td><td>${fmt(x.hit)}</td><td>${fmt(x.miss)}</td><td>${fmt(x.coalesced)}</td><td>${fmt(x.error)}</td><td><b>${pct(x.hit_rate)}</b></td></tr>`).join('') || '<tr><td colspan="6" class="muted">尚無資料</td></tr>'}</table>
      <p class="muted">每 5 秒自動更新 · ${new Date().toLocaleTimeString('zh-TW', { hour12: false })}</p>`;
  }
  await render();
  if (version === viewVersion) timer = setInterval(() => void render().catch(() => {}), 5000);
}

// ------------------------------------------------------------------ 使用者
async function users(q = '') {
  const d = await api('GET', '/users?q=' + encodeURIComponent(q));
  $('#app').innerHTML = `
    <div class="row"><input id="q" placeholder="搜尋帳號或暱稱" value="${esc(q)}"><button class="btn" id="go">搜尋</button></div>
    <table><tr><th>帳號</th><th>暱稱</th><th>目前裝置</th><th>可用點數</th><th>預扣中</th><th>註冊時間</th></tr>
    ${d.items.map((u) => `<tr class="click" data-id="${u.id}"><td>${esc(u.username)}</td><td>${esc(u.nickname)}</td>
      <td>${u.device_name ? `<span class="tag ok">${esc(u.device_name)}</span>` : '<span class="tag">未登入</span>'}</td>
      <td><b>${u.points ? fmt(u.points.available) : '—'}</b></td><td>${u.points ? fmt(u.points.held) : '—'}</td><td class="muted">${time(u.created_at)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">沒有資料</td></tr>'}</table>`;
  $('#go').onclick = () => users($('#q').value);
  $('#q').onkeydown = (e) => e.key === 'Enter' && users($('#q').value);
  document.querySelectorAll('tr.click').forEach((tr) => (tr.onclick = () => userDetail(tr.dataset.id)));
}

async function userDetail(id) {
  const [list, ledger, convs, books] = await Promise.all([api('GET', '/users?q='), api('GET', `/users/${id}/ledger`), api('GET', `/users/${id}/conversations`), api('GET', `/users/${id}/bookings`).catch(() => ({ items: [] }))]);
  const u = list.items.find((x) => x.id === id) || { username: id, nickname: '', points: null };
  $('#app').innerHTML = `
    <span class="back" id="back">← 回使用者列表</span>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><b style="font-size:17px">${esc(u.username)}</b> <span class="muted">${esc(u.nickname)}</span><br><span class="muted" style="font-size:12px">${id}</span></div>
        <div>可用 <b style="font-size:22px">${u.points ? fmt(u.points.available) : '—'}</b> 點
          <button class="btn" id="grant">補點</button>
          <button class="btn ghost" id="kick" ${u.device_name ? '' : 'disabled'}>強制登出</button></div>
      </div>
    </div>
    <div class="two">
      <div><h2>點數明細(客服查詢)</h2>
        <table><tr><th>時間</th><th>說明</th><th>點數</th><th>餘額</th></tr>
        ${ledger.items.map((i) => `<tr><td class="muted">${time(i.created_at)}</td><td>${esc(i.note)}<div class="muted" style="font-size:11px">${esc(i.ref_type)}:${esc(String(i.ref_id).slice(0, 36))}</div></td>
          <td class="${i.amount > 0 ? 'pos' : 'neg'}">${i.amount > 0 ? '+' : ''}${i.amount}</td><td>${fmt(i.balance_after)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">無紀錄</td></tr>'}</table></div>
      <div><h2>對話</h2>
        <table><tr><th>角色</th><th>最後訊息</th><th>則數</th></tr>
        ${convs.items.map((c) => `<tr class="click" data-c="${c.id}" data-n="${esc(c.character_name)}"><td>${esc(c.character_avatar)} ${esc(c.character_name)}</td><td class="muted">${esc(c.last_preview)}</td><td>${c.latest_seq}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">無對話</td></tr>'}</table></div>
    </div>
    <h2>訂位代辦</h2>
    <table><tr><th>時間</th><th>需求</th><th>狀態</th><th>結果</th></tr>
    ${books.items.map((b) => `<tr class="click" data-b="${b.id}"><td class="muted">${time(b.created_at)}</td><td>${esc(b.summary)}<div class="muted" style="font-size:11px">${esc(b.id)}</div></td>
      <td><span class="tag ${{ succeeded: 'ok', failed: 'bad', unknown: 'warn', expired: '', cancelled: '' }[b.status] ?? ''}">${esc({ collecting: '補資料中', awaiting_confirmation: '待確認', confirmed: '已確認', executing: '送出中', succeeded: '成功', failed: '失敗', unknown: '結果不明', cancelled: '已取消', expired: '已過期' }[b.status] || b.status)}</span></td>
      <td class="muted">${b.result ? (b.result.ok ? '訂位代號 ' + esc(b.result.confirmation_no) : esc(b.result.code) + ':' + esc(b.result.message)) : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">無訂位紀錄</td></tr>'}</table>`;
  $('#back').onclick = () => go('users');
  $('#grant').onclick = () => modal(`<h3 style="margin-top:0">補點給 ${esc(u.username)}</h3>
    <label>點數</label><input id="gAmt" type="number" min="1" value="100">
    <label>原因(會顯示在使用者的明細)</label><input id="gWhy" value="客服補點">
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="gOk">確認補點</button></div>`);
  document.addEventListener('click', function h(e) {
    if (e.target.id !== 'gOk') return;
    document.removeEventListener('click', h);
    api('POST', `/users/${id}/grant`, { amount: +$('#gAmt').value, reason: $('#gWhy').value }).then(() => { closeModal(); toast('已補點'); userDetail(id); }).catch((er) => toast(er.message));
  });
  $('#kick').onclick = () => api('POST', `/users/${id}/logout`).then(() => { toast('已強制登出'); userDetail(id); }).catch((er) => toast(er.message));
  document.querySelectorAll('tr[data-c]').forEach((tr) => (tr.onclick = () => conversation(id, tr.dataset.c, tr.dataset.n)));
  document.querySelectorAll('tr[data-b]').forEach((tr) => (tr.onclick = () => browserTrace(id, tr.dataset.b)));
}

async function browserTrace(userId, bookingId) {
  const d = await api('GET', `/bookings/${bookingId}/browser-trace`);
  const m = d.manifest;
  $('#app').innerHTML = `<span class="back" id="back">← 回使用者</span><h2 style="margin-top:0">Browser Agent 執行紀錄</h2>
    <p class="muted">開發模式：截圖可能含姓名、電話與 email，請勿對外分享。</p>
    <div class="card"><b>訂位 ${esc(m.booking_id)}</b><div class="muted">Run ${esc(m.run_id)} · ${time(m.started_at)} · ${m.steps?.length || 0} 個步驟 / ${m.screenshots?.length || 0} 張截圖 · ${esc(m.status || 'completed')}</div>${m.status === 'failed' ? `<div class="tag bad" style="margin-top:8px">browser 啟動或執行失敗：${esc(m.error_class || 'UnknownError')}；${m.screenshots?.length ? '已保留失敗前的截圖。' : '失敗前未取得任何截圖。'}</div>` : ''}</div>
    <div class="chat" style="max-height:none;margin-top:14px">${(m.steps || []).map((s) => `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>#${s.sequence}</b> ${esc(s.action || '無動作')} ${s.error ? `<span class="tag bad">${esc(s.error)}</span>` : ''}<div class="muted" style="font-size:12px">${esc(s.url || '')}</div>${s.screenshot ? `<img src="/api/bookings/${bookingId}/browser-trace/screens/${s.sequence}" style="display:block;max-width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px" loading="lazy">` : ''}</div>`).join('') || `<div class="muted">${m.status === 'failed' ? 'browser 在產生第一個可保存步驟前失敗，因此沒有截圖。' : 'agent 未產生可保存的步驟或截圖'}</div>`}</div>`;
  $('#back').onclick = () => userDetail(userId);
}

async function conversation(userId, cid, name) {
  const d = await api('GET', `/conversations/${cid}/messages`);
  $('#app').innerHTML = `<span class="back" id="back">← 回使用者</span><h2 style="margin-top:0">與 ${esc(name)} 的對話(最近 ${d.items.length} 則)</h2>
    <p class="muted">⚠ 對話內容屬於個資,正式環境必須有權限控管與存取稽核。</p>
    <div class="chat">${d.items.map((m) => `<div class="msg ${m.role}"><div><div class="bubble">${esc(m.content) || '<span class="muted">(空)</span>'}</div>
      <div class="meta">#${m.seq} · ${time(m.created_at)} ${m.status !== 'completed' ? `<span class="tag ${m.status === 'failed' ? 'bad' : 'warn'}">${m.status}${m.error_code ? ' ' + esc(m.error_code) : ''}</span>` : ''}
      ${m.role === 'assistant' && m.cost ? ` · 扣 ${m.cost} 點 (${m.billing_state})` : ''}
      ${m.provider ? ` · <span class="tag">${esc(m.provider)}</span> ${esc(m.model)}${m.input_tokens != null ? ` · token 輸入 ${m.input_tokens} / 輸出 ${m.output_tokens}` : ''}` : ''}</div></div></div>`).join('')}</div>`;
  $('#back').onclick = () => userDetail(userId);
}

// ------------------------------------------------------------------ 角色
async function characters() {
  const d = await api('GET', '/characters');
  $('#app').innerHTML = `<div class="row"><button class="btn" id="new">＋ 新增角色</button><span class="muted">修改後會立即清除 Redis 快取並通知各服務,不需重啟。</span></div>
    <table><tr><th></th><th>名稱</th><th>簡介</th><th>每則點數</th><th>狀態</th><th></th></tr>
    ${d.items.map((c) => `<tr><td style="font-size:22px">${esc(c.avatar)}</td><td><b>${esc(c.name)}</b><div class="muted">${esc(c.slug)}</div></td><td>${esc(c.tagline)}</td><td>${c.price}</td>
      <td><span class="tag ${c.status === 'active' ? 'ok' : ''}">${c.status === 'active' ? '上架' : '下架'}</span></td><td><button class="btn ghost" data-id="${c.id}">編輯</button></td></tr>`).join('')}</table>`;
  const edit = (c) => {
    c = c || { slug: '', name: '', tagline: '', avatar: '🙂', persona: '', greeting: '', price: 2, status: 'active', sort_order: 100 };
    modal(`<h3 style="margin-top:0">${c.id ? '編輯' : '新增'}角色</h3>
      <div class="two"><div><label>名稱</label><input id="cName" value="${esc(c.name)}"></div><div><label>代號 slug</label><input id="cSlug" value="${esc(c.slug)}"></div></div>
      <div class="two"><div><label>頭像 emoji</label><input id="cAv" value="${esc(c.avatar)}"></div><div><label>每則回覆點數</label><input id="cPrice" type="number" min="0" value="${c.price}"></div></div>
      <label>簡介</label><input id="cTag" value="${esc(c.tagline)}">
      <label>人設 / system prompt(不會顯示給使用者)</label><textarea id="cPersona">${esc(c.persona)}</textarea>
      <label>開場白</label><textarea id="cGreet">${esc(c.greeting)}</textarea>
      <div class="two"><div><label>狀態</label><select id="cStatus"><option value="active" ${c.status === 'active' ? 'selected' : ''}>上架</option><option value="disabled" ${c.status !== 'active' ? 'selected' : ''}>下架</option></select></div>
      <div><label>排序</label><input id="cSort" type="number" value="${c.sort_order}"></div></div>
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="cOk">儲存</button></div>`);
    $('#cOk').onclick = () => {
      const body = { slug: $('#cSlug').value, name: $('#cName').value, tagline: $('#cTag').value, avatar: $('#cAv').value, persona: $('#cPersona').value, greeting: $('#cGreet').value, price: +$('#cPrice').value, status: $('#cStatus').value, sort_order: +$('#cSort').value, model: c.model ?? null };
      api(c.id ? 'PUT' : 'POST', '/characters' + (c.id ? '/' + c.id : ''), body).then(() => { closeModal(); toast('已儲存'); characters(); }).catch((e) => toast(e.message));
    };
  };
  $('#new').onclick = () => edit();
  document.querySelectorAll('button[data-id]').forEach((b) => (b.onclick = () => edit(d.items.find((x) => x.id === b.dataset.id))));
}

go('overview');
</script>
</body>
</html>
