# 對外入口:放在多個 gateway replica 前面(docker-compose.scale.yml 的 `edge`)。
# 職責只有三件事:分流到每個 gateway、不讓運維端點外露、把真實的用戶端 IP 交給 gateway 做限流。
# 驗證、限流、路由白名單仍然都在 gateway。

# Docker 內建 DNS。valid=2s:replica 增減後最多 2 秒就會看到新的位址清單。
# 一定要搭配下面 `set $gateway` 的「變數」寫法 —— nginx 只有在 proxy_pass 用變數時才會在執行期重新解析,
# 否則會在啟動時解析一次就固定下來(和 gateway 以前遇到的問題一樣)。
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 8080;
    client_max_body_size 512k;   # gateway 自己的上限是 256KB
    access_log off;              # 和 gateway 一樣只記錯誤與慢請求(由 gateway 記),避免高流量下的日誌成本

    location = /edge-healthz {
        return 200 "ok\n";
    }

    # 運維端點只給內部網路。gateway 本身也要 internal token,這裡是第二道防線。
    location ~ ^/(internal|metrics|readyz) {
        return 404;
    }

    location / {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 覆寫而不是附加:用戶端自己帶的 X-Forwarded-For 一律丟掉,否則可以偽造來源 IP 繞過登入的 IP 限流。
        # 若前面還有一層你信任的負載平衡器,改成 $proxy_add_x_forwarded_for 並設定 real_ip。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(AI 逐字回覆):不能緩衝,也不能有短的讀取逾時
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        # 連線階段要很短:同一個 Docker 網路內,正常連線在毫秒內完成。
        # 被移除的 replica 的 IP 不會回 RST,只會讓 SYN 沒有回應 —— 逾時設太長,滾動更新時每個剛好撞到的請求都要多等這麼久。
        proxy_connect_timeout 500ms;

        # 某個 gateway replica 連不上時換下一個。「連線階段」失敗代表請求根本沒送出,所以對 POST 也是安全的;
        # nginx 預設不會重送「已經送出」的非冪等請求,因此不會重複下單。
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 5s;
    }
}
